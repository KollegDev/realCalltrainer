<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>CallTrainer</title>
    <style>
      /* ── App-Shell, Liquid Glass (aaii.up.railway.app) ───────────────────
         Fester Viewport, kein Seiten-Scroll. Alles per Tipp erreichbar.
         Phasen: body[data-phase="idle" | "call" | "end"]. */

      :root {
        --ink: #1e2025;
        --body: #62656e;
        --muted: #8a8d96;
        --accent: #6384ff;
        --accent-soft: rgba(99, 132, 255, 0.13);
        --good: #2fa47c;
        --warn: #d9a13b;
        --danger: #cf4437;
        --hairline: rgba(20, 22, 28, 0.06);
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html, body { height: 100%; }
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        background: #f3f4f8;
        color: var(--body);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        line-height: 24px;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      /* Farbnebel */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(45% 40% at 15% 8%, rgba(99, 132, 255, 0.18), transparent 70%),
          radial-gradient(40% 45% at 88% 18%, rgba(178, 140, 255, 0.14), transparent 70%),
          radial-gradient(50% 40% at 55% 100%, rgba(110, 200, 255, 0.12), transparent 70%);
      }

      /* Wasserzeichen */
      .watermark {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: var(--ink);
        opacity: 0.05;
      }
      .watermark .wm-big { font-size: clamp(38px, 10vw, 64px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
      .watermark .wm-small { font-size: 14px; font-weight: 500; margin-top: 6px; }

      /* ── Glas-Grundrezept ──────────────────────────────────────────────── */
      .glass {
        background: rgba(255, 255, 255, 0.55);
        -webkit-backdrop-filter: blur(18px) saturate(170%);
        backdrop-filter: blur(18px) saturate(170%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      }

      /* ── Shell-Layout ──────────────────────────────────────────────────── */
      .shell {
        position: relative;
        z-index: 1;
        height: 100%;
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
      }

      .topbar { display: flex; justify-content: flex-end; }
      .iconbtn {
        width: 48px; height: 48px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        background: rgba(255, 255, 255, 0.55);
        -webkit-backdrop-filter: blur(18px) saturate(170%);
        backdrop-filter: blur(18px) saturate(170%);
        color: var(--ink);
        font-size: 20px;
        cursor: pointer;
      }

      /* Mitte: Zahnrad + Rollen-Zusammenfassung */
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 0;
      }
      .gearbtn {
        width: 84px; height: 84px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.65);
        background: rgba(255, 255, 255, 0.6);
        -webkit-backdrop-filter: blur(18px) saturate(170%);
        backdrop-filter: blur(18px) saturate(170%);
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.10);
        font-size: 36px;
        cursor: pointer;
        transition: transform 140ms ease;
      }
      .gearbtn:active { transform: scale(0.95) rotate(20deg); }
      .rolesummary { text-align: center; }
      .rolesummary .r-name { font-size: 18px; font-weight: 600; color: var(--ink); }
      .rolesummary .r-tag { font-size: 13px; color: var(--muted); max-width: 34ch; margin: 2px auto 0; line-height: 1.35; }
      .rolesummary .r-diff {
        display: inline-block; margin-top: 8px;
        font-size: 12px; padding: 3px 12px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(20, 22, 28, 0.07);
        color: #3d4048;
      }

      /* Unteres Viertel: gestapelte Call-Buttons */
      .callstack {
        min-height: 25dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
      }
      .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #c3c6cf; }
      .dot.live { background: var(--good); box-shadow: 0 0 8px rgba(47, 164, 124, .55); }
      .dot.paused { background: var(--warn); }
      .dot.ringing { background: var(--accent); box-shadow: 0 0 8px var(--accent-soft); animation: pulse 1.2s infinite; }
      @keyframes pulse { 50% { opacity: .4; } }
      .err { color: var(--danger); font-size: 13px; text-align: center; max-width: 40ch; line-height: 1.4; }

      button.pill {
        font: inherit; font-size: 15px; font-weight: 500;
        padding: 12px 26px;
        min-height: 48px; min-width: 180px;
        border: 1px solid rgba(20, 22, 28, 0.10);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink);
        cursor: pointer;
      }
      button.pill:active:not(:disabled) { transform: scale(0.98); }
      button:disabled { opacity: .35; cursor: not-allowed; }

      /* Der eine große Button: Anrufen (grün) / Auflegen (rot) */
      .bigcall {
        width: 84px; height: 84px;
        border-radius: 50%;
        border: none;
        font-size: 34px;
        color: #fff;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: transform 120ms ease;
      }
      .bigcall:active:not(:disabled) { transform: scale(0.94); }
      #startBtn { background: var(--good); box-shadow: 0 12px 30px -8px rgba(47, 164, 124, 0.6); }
      #endBtn { background: var(--danger); box-shadow: 0 12px 30px -8px rgba(207, 68, 55, 0.6); }
      #endBtn .ph { display: inline-block; transform: rotate(135deg); }

      /* Phasen-Sichtbarkeit */
      .only-idle, .only-call { display: none !important; }
      body[data-phase="idle"] .only-idle { display: flex !important; }
      body[data-phase="call"] .only-call { display: flex !important; }
      body[data-phase="call"] .gearbtn { opacity: .35; pointer-events: none; }

      /* ── Sheets & Drawer ───────────────────────────────────────────────── */
      .overlay {
        position: fixed; inset: 0; z-index: 40;
        display: none;
        background: rgba(243, 244, 248, 0.62);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }
      .overlay.open { display: block; }

      .sheet {
        position: absolute;
        left: 50%; bottom: 0;
        transform: translateX(-50%);
        width: min(480px, 100%);
        max-height: 88dvh;
        display: flex; flex-direction: column;
        border-radius: 22px 22px 0 0;
        padding: 14px 20px calc(20px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.82);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
        backdrop-filter: blur(22px) saturate(170%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 -12px 40px rgba(31, 38, 135, 0.16);
      }
      .sheet .grabber { width: 40px; height: 4px; border-radius: 2px; background: rgba(20,22,28,0.15); margin: 0 auto 12px; }
      .sheet .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .sheet .sheet-title { font-size: 16px; font-weight: 600; color: var(--ink); }
      .sheet .sheet-body { overflow-y: auto; min-height: 0; }
      .closebtn {
        width: 36px; height: 36px; border-radius: 50%;
        border: 1px solid rgba(20, 22, 28, 0.10);
        background: rgba(255,255,255,0.8); color: var(--ink);
        font-size: 16px; cursor: pointer;
      }

      .label {
        font-size: 11px; font-weight: 600;
        letter-spacing: 0.08em; text-transform: uppercase;
        color: #7a7d86; margin: 14px 0 6px;
      }
      select, textarea, input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 1px solid rgba(20, 22, 28, 0.10);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.85);
        font: inherit; font-size: 15px;
        color: var(--ink);
      }
      select { min-height: 48px; }
      textarea { min-height: 200px; font-size: 13px; line-height: 1.5; resize: vertical; user-select: text; }
      select:focus, textarea:focus, input:focus { border-color: var(--muted); outline: none; }

      button.small {
        font: inherit; font-size: 14px; font-weight: 500;
        min-height: 44px; padding: 10px 18px;
        border: 1px solid rgba(20, 22, 28, 0.10); border-radius: 999px;
        background: rgba(255, 255, 255, 0.85); color: var(--ink); cursor: pointer;
      }
      button.small.primary { background: #16181d; border-color: #16181d; color: #fff; }
      .btnrow { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
      .edited-badge { font-size: 12px; color: var(--warn); }

      details.adv { margin-top: 14px; }
      details.adv summary { cursor: pointer; font-size: 14px; color: var(--ink); font-weight: 500; min-height: 44px; display: flex; align-items: center; }

      /* Hamburger-Drawer */
      .drawer {
        position: absolute;
        top: 0; right: 0; height: 100%;
        width: min(340px, 88vw);
        display: flex; flex-direction: column;
        padding: calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.85);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
        backdrop-filter: blur(22px) saturate(170%);
        border-left: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: -12px 0 40px rgba(31, 38, 135, 0.16);
        overflow-y: auto;
      }
      .drawer .menuitem {
        display: flex; align-items: center; justify-content: space-between;
        min-height: 52px; padding: 6px 4px;
        font-size: 15px; color: var(--ink); font-weight: 500;
        border-bottom: 1px solid var(--hairline);
        cursor: pointer; background: none; border-left: none; border-right: none; border-top: none;
        width: 100%; text-align: left; font-family: inherit;
      }
      .drawer a.menuitem { text-decoration: none; }

      /* Sprach-Toggle */
      .langtoggle { display: inline-flex; border: 1px solid rgba(20,22,28,0.1); border-radius: 999px; overflow: hidden; }
      .langtoggle button {
        font: inherit; font-size: 14px; font-weight: 600;
        padding: 8px 18px; min-height: 40px;
        border: none; background: transparent; color: var(--muted); cursor: pointer;
      }
      .langtoggle button.on { background: #16181d; color: #fff; }

      /* Intro / Consent zentrierte Modals */
      .modalwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .modal {
        max-width: 440px; width: 100%;
        max-height: 86dvh; overflow-y: auto;
        padding: 26px 26px 22px;
      }
      .modal h2 { margin: 0 0 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
      .modal p { margin: 0 0 12px; font-size: 14px; line-height: 21px; }
      .consent-warn {
        background: rgba(217, 161, 59, 0.12);
        border: 1px solid rgba(217, 161, 59, 0.35);
        border-radius: 12px; padding: 12px 14px; margin: 12px 0;
        font-size: 14px; line-height: 21px;
      }
      .consent-warn strong { color: #9a7015; }
      .consent-list { margin: 0 0 14px; padding-left: 18px; font-size: 14px; line-height: 1.6; }
      .consent-age { font-size: 12px; color: var(--muted); margin-top: 10px; }
      .modal button.primary {
        font: inherit; font-size: 15px; font-weight: 600;
        width: 100%; min-height: 50px; margin-top: 6px;
        border: none; border-radius: 999px;
        background: #16181d; color: #fff; cursor: pointer;
      }

      /* Scorecard-Inhalte */
      .score-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
      .score-num { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
      .score-num.good { color: var(--good); }
      .score-num.mid { color: var(--warn); }
      .score-num.bad { color: var(--danger); }
      .score-verdict { font-size: 15px; color: var(--ink); font-weight: 500; }
      .score-outcome { font-size: 13px; color: var(--muted); margin-top: 2px; }
      .score-cols { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
      .score-cols > div { flex: 1; min-width: 180px; }
      .score-list { margin: 4px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.5; color: #3d4048; user-select: text; }
      .score-block { margin-top: 12px; font-size: 14px; line-height: 1.5; color: #3d4048; user-select: text; }
      .score-block b { display: block; margin-bottom: 2px; color: #7a7d86; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
      .score-metrics { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); }
      .metric { font-size: 12px; color: var(--muted); }
      .metric b { display: block; font-size: 17px; font-weight: 600; color: var(--ink); }
      .transcript { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; user-select: text; }
      .turn { padding: 8px 12px; border-radius: 12px; max-width: 90%; font-size: 13px; line-height: 1.45; white-space: pre-wrap; color: #3d4048; border: 1px solid var(--hairline); }
      .turn.rep { align-self: flex-end; background: var(--accent-soft); }
      .turn.prospect { align-self: flex-start; background: rgba(255, 255, 255, 0.85); }
      .turn .who { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
    </style>
  </head>
  <body data-phase="idle">
    <div class="watermark" aria-hidden="true">
      <div class="wm-big">CallTrainer</div>
      <div class="wm-small">by SuperShipper</div>
    </div>

    <div class="shell">
      <div class="topbar">
        <button id="menuBtn" class="iconbtn" aria-label="Menü">☰</button>
      </div>

      <div class="stage">
        <button id="gearBtn" class="gearbtn" aria-label="Szenario">⚙️</button>
        <div class="rolesummary">
          <div id="roleName" class="r-name"></div>
          <div id="roleTag" class="r-tag"></div>
          <div id="roleDiff" class="r-diff"></div>
        </div>
      </div>

      <div class="callstack">
        <div id="error" class="err"></div>
        <div class="status">
          <span id="dot" class="dot"></span>
          <span id="statusText"></span>
        </div>
        <button id="replayBtn" class="pill only-call" data-i18n="replay" disabled></button>
        <button id="pauseBtn" class="pill only-call" data-i18n="pause" disabled></button>
        <button id="startBtn" class="bigcall only-idle" aria-label="Anrufen">📞</button>
        <button id="endBtn" class="bigcall only-call" aria-label="Auflegen"><span class="ph">📞</span></button>
      </div>
    </div>

    <!-- ── Zahnrad: Szenario-Sheet ── -->
    <div id="configOverlay" class="overlay">
      <div class="sheet">
        <div class="grabber"></div>
        <div class="sheet-head">
          <div class="sheet-title" data-i18n="cfgTitle"></div>
          <button class="closebtn" data-close="configOverlay">✕</button>
        </div>
        <div class="sheet-body">
          <div class="label" data-i18n="cfgRole"></div>
          <select id="scenario"></select>
          <div class="hint"><span id="cfgRoleTag"></span> <span id="editedBadge" class="edited-badge"></span></div>

          <div class="label" data-i18n="cfgDiff"></div>
          <select id="difficulty"></select>

          <details class="adv" id="editPanel">
            <summary data-i18n="cfgEdit"></summary>
            <div class="label" data-i18n="cfgGreeting"></div>
            <input type="text" id="editGreeting" />
            <div class="label" data-i18n="cfgPrompt"></div>
            <textarea id="editPrompt" spellcheck="false"></textarea>
            <div class="btnrow">
              <button id="saveRoleBtn" class="small primary" data-i18n="save"></button>
              <button id="resetRoleBtn" class="small" data-i18n="reset"></button>
            </div>
          </details>
        </div>
      </div>
    </div>

    <!-- ── Hamburger-Drawer ── -->
    <div id="menuOverlay" class="overlay">
      <div class="drawer">
        <div class="sheet-head">
          <div class="sheet-title">CallTrainer</div>
          <button class="closebtn" data-close="menuOverlay">✕</button>
        </div>
        <button id="miIntro" class="menuitem"><span data-i18n="miIntro"></span><span>›</span></button>
        <div class="menuitem" style="cursor:default;">
          <span data-i18n="miLang"></span>
          <span class="langtoggle">
            <button id="langDe">DE</button>
            <button id="langEn">EN</button>
          </span>
        </div>
        <div style="border-bottom:1px solid var(--hairline); padding:10px 4px 16px;">
          <div class="label" style="margin-top:4px;" data-i18n="miMic"></div>
          <select id="mic"></select>
          <div class="hint"><span data-i18n="micLevelLabel"></span>: <span id="micLevel">—</span></div>
          <div class="hint" data-i18n="micHint"></div>
        </div>
        <a id="miPrivacy" class="menuitem" href="/privacy.html" target="_blank" rel="noopener"><span data-i18n="miPrivacy"></span><span>↗</span></a>
      </div>
    </div>

    <!-- ── Intro (First-Run + über Menü) ── -->
    <div id="introOverlay" class="overlay">
      <div class="modalwrap">
        <div class="glass modal">
          <div style="display:flex; justify-content:center; margin-bottom:14px;">
            <span class="langtoggle">
              <button id="introLangDe">DE</button>
              <button id="introLangEn">EN</button>
            </span>
          </div>
          <h2 data-i18n="introTitle"></h2>
          <p data-i18n="introBody"></p>
          <button id="introOk" class="primary" data-i18n="introOk"></button>
        </div>
      </div>
    </div>

    <!-- ── Consent (vor dem ersten Anruf) ── -->
    <div id="consent" class="overlay">
      <div class="modalwrap">
        <div class="glass modal">
          <h2 data-i18n="consentTitle"></h2>
          <p data-i18n="consentIntro"></p>
          <div class="consent-warn"><strong data-i18n="consentWarnTitle"></strong><br /><span data-i18n="consentWarnBody"></span></div>
          <ul class="consent-list">
            <li data-i18n="consentP1"></li>
            <li data-i18n="consentP2"></li>
            <li data-i18n="consentP3"></li>
          </ul>
          <p><a href="/privacy.html" target="_blank" rel="noopener" data-i18n="consentPrivacy"></a></p>
          <button id="consentBtn" class="primary" data-i18n="consentOk"></button>
          <div class="consent-age" data-i18n="consentAge"></div>
        </div>
      </div>
    </div>

    <!-- ── Auswertung ── -->
    <div id="scoreOverlay" class="overlay">
      <div class="sheet">
        <div class="grabber"></div>
        <div class="sheet-head">
          <div class="sheet-title" data-i18n="scoreTitle"></div>
          <button class="closebtn" data-close="scoreOverlay">✕</button>
        </div>
        <div class="sheet-body">
          <div class="score-head">
            <div id="scoreNum" class="score-num">–</div>
            <div>
              <div id="scoreVerdict" class="score-verdict"></div>
              <div id="scoreOutcome" class="score-outcome"></div>
            </div>
          </div>
          <div class="score-cols">
            <div>
              <div class="label" style="margin:0;" data-i18n="scoreStrengths"></div>
              <ul id="scoreStrengths" class="score-list"></ul>
            </div>
            <div>
              <div class="label" style="margin:0;" data-i18n="scoreMistakes"></div>
              <ul id="scoreMistakes" class="score-list"></ul>
            </div>
          </div>
          <div id="scoreMissed" class="score-block"></div>
          <div id="scoreNext" class="score-block"></div>
          <div id="scoreLines" class="score-block"></div>
          <div id="scoreMetrics" class="score-metrics"></div>
          <details class="adv">
            <summary data-i18n="scoreTranscript"></summary>
            <div id="transcript" class="transcript"></div>
          </details>
          <div class="btnrow">
            <button id="reportBtn" class="small" data-i18n="report"></button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
